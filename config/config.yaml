daemon:
  listen_addr: ":8080"
  data_dir: "/var/lib/homeagent"
  heartbeat_interval: 15s
  check_interval: 30s
  log_level: "info"

llm:
  provider: "deepseek"
  model: "deepseek-v4-flash"
  base_url: "https://api.deepseek.com"
  api_key: ""
  adapter: "deepseek"
  temperature: 0.7
  max_tokens: 4096
  sources:
    - name: "deepseek"
      base_url: "https://api.deepseek.com"
      model: "deepseek-v4-flash"
      adapter: "deepseek"
      adapter_path: "adapters/deepseek.lua"
    - name: "openai"
      base_url: "https://api.openai.com/v1"
      model: "gpt-4o"
      adapter: "openai"
      adapter_path: "adapters/openai.lua"
    - name: "anthropic"
      base_url: "https://api.anthropic.com"
      model: "claude-sonnet-4-20250514"
      adapter: "anthropic"
      adapter_path: "adapters/anthropic.lua"
    - name: "gemini"
      base_url: "https://generativelanguage.googleapis.com"
      model: "gemini-2.0-flash"
      adapter: "gemini"
      adapter_path: "adapters/gemini.lua"
    - name: "mistral"
      base_url: "https://api.mistral.ai"
      model: "mistral-large-latest"
      adapter: "mistral"
      adapter_path: "adapters/mistral.lua"
    - name: "groq"
      base_url: "https://api.groq.com"
      model: "llama3-70b-8192"
      adapter: "groq"
      adapter_path: "adapters/groq.lua"
    - name: "github"
      base_url: "https://models.inference.ai.azure.com"
      model: "gpt-4o"
      adapter: "github"
      adapter_path: "adapters/github.lua"
    - name: "ollama"
      base_url: "http://localhost:11434"
      model: "llama3"
      adapter: "ollama"
      adapter_path: "adapters/ollama.lua"

defaults:
  image: "homeagent/agent-base:latest"
  llm_endpoints:
    - "https://api.openai.com/v1"
  snapshot_policy:
    interval: 10m
    max_snapshots: 20
    pre_action: true
    post_action: false
  rollback_policy:
    max_retries: 3
    health_threshold: 3
    cooldown_period: 30s
    auto_rollback: true
  resource_limit:
    cpu: "2"
    memory: "2g"
    disk: "10g"
    network: true
  openclaw_enabled: true

agents:
  - id: "default"
    name: "Default Agent"
    image: "homeagent/agent-base:latest"
    llm_endpoints:
      - "https://api.openai.com/v1"
